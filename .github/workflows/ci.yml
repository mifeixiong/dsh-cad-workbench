name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps for offline review tests
        run: python -m pip install --upgrade pip ezdxf pillow numpy
      - name: Offline suite (JS contract + graph + review)
        run: python test/run_all.py
