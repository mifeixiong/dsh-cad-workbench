name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    # 插件依赖 SolidWorks COM，只支持 Windows；离线单测也只在 Windows 上跑。
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps for offline review tests
        run: python -m pip install --upgrade pip ezdxf pillow numpy
      - name: Offline suite (JS contract + graph + review)
        run: python test/run_all.py
